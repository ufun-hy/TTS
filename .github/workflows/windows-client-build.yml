name: Build AI Live Studio Windows Test Installer

on:
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "audio_client/**"
      - "audio_cache/**"
      - "local_runtime/**"
      - "recording_transcript/**"
      - "server/**"
      - "timeline/**"
      - "voice_datasets/**"
      - "web/**"
      - "config/**"
      - "scripts/**"
      - "windows_client.py"
      - "windows_playback_service.py"
      - "windows_launcher.py"
      - "build/windows/**"
      - "tests/**"
      - ".github/workflows/windows-client-build.yml"
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          choco install innosetup ffmpeg -y --no-progress

      - name: Run Windows runtime tests
        shell: pwsh
        run: |
          python -m unittest tests.test_audio_cache tests.test_live_session tests.test_playback tests.test_service_entrypoints tests.test_stage1_efficiency tests.test_stage3_efficiency tests.test_voice_prompt tests.test_wav_compat tests.test_windows_runtime tests.test_windows_review_fixes tests.test_windows_packaging tests.test_windows_process_tracking

      - name: Run WinMM tests
        shell: pwsh
        continue-on-error: true
        run: python -m unittest tests.test_winmm_smoke

      - name: Verify runtime command assembly
        shell: pwsh
        run: python scripts/windows-runtime.py start --dry-run

      - name: Build full installer
        shell: pwsh
        run: .\build\windows\build.ps1

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = "build/windows/output/AI-Live-Studio-Windows-Test-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not generated: $installer" }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          "$hash  AI-Live-Studio-Windows-Test-Setup.exe" | Set-Content -Path "$installer.sha256" -Encoding ASCII
          Get-Item $installer | Select-Object FullName, Length
          Get-Content "$installer.sha256"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Live-Studio-Windows-Test-Setup
          path: |
            build/windows/output/*
          if-no-files-found: error
          retention-days: 30
