name: Main Business Fidelity Audit
on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-offline-runtime-v1
    paths:
      - "server/**"
      - "web/**"
      - "audio_cache/**"
      - "audio_client/**"
      - "tests/main_business_baseline/**"
      - "scripts/audit_main_business.py"
      - ".github/workflows/main-business-fidelity.yml"
permissions:
  contents: read
jobs:
  main-business-fidelity:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export tracked source snapshot for local parity testing
        shell: pwsh
        run: git archive --format=zip --output=$env:RUNNER_TEMP/tts-source.zip HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tts-verified-source-snapshot
          path: ${{ runner.temp }}/tts-source.zip
          if-no-files-found: error
          retention-days: 3
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install cryptography
      - name: Run all 12 unmodified main business tests and retain per-file logs
        shell: pwsh
        run: |
          python scripts/audit_main_business.py --output main-business-audit --timeout 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload raw audit and per-test logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-business-fidelity-audit
          path: main-business-audit/
          if-no-files-found: warn
          retention-days: 30
