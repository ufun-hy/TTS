name: Windows Functional Regression

on:
  push:
    branches:
      - codex/windows-offline-runtime-v1
    paths:
      - "audio_cache/**"
      - "audio_client/**"
      - "server/**"
      - "web/**"
      - "windows_launcher.py"
      - "desktop_shell.py"
      - "windows_playback_service.py"
      - "tests/**"
      - ".github/workflows/windows-functional-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test prerequisites
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography
      - name: Install verified FFmpeg for audio processing tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-test.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-19-13-06/ffmpeg-n8.1.3-18-g46d899d7a0-win64-lgpl-shared-8.1.zip" -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "638dd2a073cc1838cb668e736a822a1a58a3ca5405a109b0eca41c5ee03ec9a1") { throw "FFmpeg SHA256 mismatch: $actualHash" }
          $destination = Join-Path $env:RUNNER_TEMP "ffmpeg-test"
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $ffmpeg = Get-ChildItem -LiteralPath $destination -Filter "ffmpeg.exe" -File -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "FFmpeg archive does not contain ffmpeg.exe" }
          $ffmpeg.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate changed Python modules
        shell: pwsh
        run: |
          python -m py_compile desktop_shell.py windows_launcher.py windows_playback_service.py audio_cache/library.py audio_cache/manager.py audio_cache/server.py audio_cache/replay_journal.py server/live_session.py server/text_studio.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Newly added functionality regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_windows_desktop_shell tests.test_generation_playback_split tests.test_audio_library tests.test_library_replay tests.test_replay_journal tests.test_audio_library_capacity tests.test_tts_client_migration tests.test_qwen_asr tests.test_voice_datasets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Related existing regression
        shell: pwsh
        run: |
          python -m unittest -v tests.test_live_session tests.test_text_studio tests.test_windows_playback_lifecycle tests.test_audio_cache tests.test_wav_compat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
