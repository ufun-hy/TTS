name: Build AI Live Studio Windows Patch

on:
  push:
    branches:
      - codex/windows-offline-runtime-v1
    paths:
      - "server/**"
      - "audio_cache/**"
      - "audio_client/**"
      - "local_runtime/**"
      - "recording_transcript/**"
      - "timeline/**"
      - "voice_datasets/**"
      - "config/**"
      - "build/windows/**"
      - "tests/**"
      - "scripts/**"
      - "windows_playback_service.py"
      - "windows_client.py"
      - "windows_launcher.py"
      - "web/**"
      - ".github/workflows/windows-patch-build.yml"
  workflow_dispatch:

jobs:
  build-patch:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Test offline updates and build launcher
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m unittest tests.test_windows_offline_patch tests.test_windows_packaging tests.test_windows_process_tracking tests.test_windows_playback_lifecycle
          if ($LASTEXITCODE -ne 0) { throw "Windows patch tests failed" }
          python -m PyInstaller --clean --noconfirm build/windows/AI-Live-Studio.spec
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed" }

      - name: Build patch archive
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $stage = Join-Path $env:RUNNER_TEMP "AI-Live-Studio-Windows-Patch"
          $output = Join-Path $workspace "build\windows\patch-output"
          New-Item -ItemType Directory -Force -Path $stage, $output | Out-Null

          # Includes "audio_cache" and all other tracked application modules;
          # never includes runtime/python, DLLs, models or user data.
          python build/windows/package_app.py (Join-Path $stage "payload")
          if ($LASTEXITCODE -ne 0) { throw "Application packaging failed" }
          $tools = Join-Path $stage "tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Copy-Item local_runtime/offline_patch.py $tools
          Copy-Item build/windows/Apply-Patch.ps1, build/windows/Apply-Patch.cmd $stage
          Copy-Item docs/windows-distribution.md (Join-Path $stage "README.md")

          git rev-parse HEAD | Set-Content -LiteralPath (Join-Path $stage "PATCH_COMMIT.txt") -Encoding ASCII

          $zip = Join-Path $output "AI-Live-Studio-Windows-Patch.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal -Force
          $size = (Get-Item -LiteralPath $zip).Length
          if ($size -gt 100MB) { throw "Patch archive is unexpectedly large: $size bytes" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  AI-Live-Studio-Windows-Patch.zip" |
            Set-Content -LiteralPath (Join-Path $output "AI-Live-Studio-Windows-Patch.zip.sha256") -Encoding ASCII
          Get-ChildItem -LiteralPath $output | Select-Object Name, Length

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Live-Studio-Windows-Patch
          path: build/windows/patch-output/*
          if-no-files-found: error
          retention-days: 30
