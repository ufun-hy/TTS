name: Apply Text Studio Facts Restore

on:
  push:
    branches: [main]
    paths:
      - ".tmp/text-studio-facts-restore.part*"
      - ".github/workflows/apply-text-studio-facts-restore.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Text Studio page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          encoded = ''.join(
              Path(f'.tmp/text-studio-facts-restore.part{i}').read_text(encoding='utf-8').strip()
              for i in range(6)
          )
          html = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          Path('web/text-studio.html').write_text(html, encoding='utf-8')
          PY

      - name: Validate Text Studio page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('web/text-studio.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*)</script>', html, re.S)
          assert match, 'inline script not found'
          Path('/tmp/text-studio.js').write_text(match.group(1), encoding='utf-8')
          for key in [
              '原稿还原（重复朗读）', '商品事实', '分析重复轮次', '应用还原稿',
              '检查全篇一致性', '批量修正', 'liveCandidatePools', '开始循环智播',
              'function invalidateFacts', 'id="model"', '刷新模型列表'
          ]:
              assert key in html, key
          PY
          node --check /tmp/text-studio.js
          test "$(git hash-object web/text-studio.html)" = "b2efce7656c407dc0684188f9e146f4e7102e8b7"

      - name: Commit feature and clean staging files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .tmp/text-studio-facts-restore.gz.b64 .tmp/text-studio-facts-restore.part0 .tmp/text-studio-facts-restore.part1 .tmp/text-studio-facts-restore.part2 .tmp/text-studio-facts-restore.part3 .tmp/text-studio-facts-restore.part4 .tmp/text-studio-facts-restore.part5
          git rm -f .github/workflows/apply-text-studio-facts-restore.yml
          git add web/text-studio.html
          git commit -m "feat(text-studio): add script restore and fact consistency"
          git pull --rebase origin main
          git push origin HEAD:main
