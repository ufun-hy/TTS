<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长录音音色制作 · 语音智播</title><link rel="stylesheet" href="/voice-studio.css"></head>
<body><main class="wrap">
<header><div><a href="/">← 返回文本工作台</a><h1>从长录音中挑选好声音</h1><p>单主播录音 · 本地分析 · 默认轻降噪 · 试听后保存</p></div><span class="badge">参考片段不超过 30 秒</span></header>
<section class="card"><h2>1. 上传录音</h2><p class="hint">支持 WAV、MP3、M4A、MP4，最长 1 小时、最大 2 GiB。多人插话、音乐和混响仍需人工确认。</p>
<form id="uploadForm"><div class="fields"><label>主播名称<input id="speakerName" required maxlength="30" placeholder="例如：主播小桃"></label><label>原始录音<input id="sourceFile" type="file" required accept=".wav,.mp3,.m4a,.mp4"></label><label>开始位置（秒）<input id="rangeStart" type="number" min="0" max="3599" step="0.1" value="0"></label><label>结束位置（秒，可留空）<input id="rangeEnd" type="number" min="0" max="3600" step="0.1" placeholder="全文"></label></div><button id="uploadButton" type="submit" class="primary" disabled>上传并分析</button><progress id="uploadProgress" value="0" max="100" hidden></progress></form><p id="readiness" class="hint" role="status">正在检查离线模型…</p></section>
<section class="card"><h2>2. 分析任务</h2><div class="actions"><label>选择任务<select id="jobs"><option value="">暂无任务</option></select></label><button id="refreshJobs" type="button">刷新列表</button><button id="pause" type="button" disabled>暂停</button><button id="resume" type="button" disabled>继续</button></div><p id="jobStatus" role="status" aria-live="polite">上传后会依次检测人声、检查音质、分析风格并转写候选。</p><progress id="jobProgress" value="0" max="100" hidden></progress><p id="message" class="hint" role="alert"></p></section>
<section class="card"><h2>3. 核对候选与对比试听</h2><p class="hint">建议标签来自声音分析，不等同于促单等用途。每段都需核对说话人、完整边界和实际原文。切换参考版本后会重新转写。</p><label>统一试听文案<textarea id="testText" maxlength="200" rows="2">你好，欢迎来到直播间。这款商品有两种规格，价格是九十九元。请注意，购买前先确认尺寸和数量。</textarea></label><div id="candidates" class="candidates"><p class="empty">分析完成后，候选会显示在这里。</p></div><button id="more" type="button" disabled>准备下一组候选（最多 12 个）</button></section>
</main><script src="/voice-studio.js"></script><script src="/windows-session.js"></script></body></html>
