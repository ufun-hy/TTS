<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>录音转文稿</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#172033;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0}.page{max-width:900px;margin:0 auto;padding:48px 20px 72px}h1{margin:0;font-size:30px}h2{margin:0;font-size:18px}.intro{margin:8px 0 28px;color:#667085}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:24px;box-shadow:0 10px 30px #1720330d}.dropzone{display:block;padding:38px 20px;border:1.5px dashed #98a2b3;border-radius:13px;text-align:center;cursor:pointer;background:#fafbff;transition:.15s}.dropzone:hover,.dropzone.dragover{border-color:#2f6fed;background:#f1f5ff}.drop-title{font-size:17px;font-weight:700}.drop-hint{margin-top:7px;color:#667085;font-size:13px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.meta-item{padding:12px 14px;background:#f8fafc;border-radius:10px}.meta-label{display:block;color:#667085;font-size:12px;margin-bottom:5px}.meta-value{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.actions{display:flex;gap:10px;align-items:center;margin-top:20px}.button{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:#e9eef7;color:#172033}.button.primary{background:#2f6fed;color:#fff}.button:disabled{opacity:.45;cursor:not-allowed}.status{margin:20px 0 0;color:#475467}.status strong{color:#172033}.hint{min-height:20px;margin:8px 0 0;color:#667085;font-size:13px}.error{color:#b42318}.result{margin-top:26px}.result-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.transcript{min-height:180px;padding:20px;white-space:pre-wrap;line-height:1.9;font-size:16px;border:1px solid #e4e7ec;border-radius:12px;background:#fcfcfd;word-break:break-word}.result-actions{display:flex;gap:10px;margin-top:14px}.hidden{display:none}@media(max-width:600px){.page{padding-top:28px}.card{padding:16px}.meta{grid-template-columns:1fr}.result-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="page">
  <h1>录音转文稿</h1>
  <p class="intro">上传一段录音，生成可以直接阅读的中文文稿。</p>

  <section class="card" aria-labelledby="upload-title">
    <div class="actions"><label for="savedResults">已保存的稿清理结果</label><select id="savedResults"><option value="">选择历史文稿</option></select><button class="button" id="openResult" type="button">打开</button></div>
    <h2 id="upload-title" class="hidden">上传录音</h2>
    <label class="dropzone" id="dropzone" for="fileInput">
      <input id="fileInput" type="file" accept=".wav,.mp3,.m4a,.mp4,audio/wav,audio/mpeg,audio/mp4,video/mp4" hidden />
      <div class="drop-title">选择录音 / 拖入文件</div>
      <div class="drop-hint">支持 wav、mp3、m4a、mp4</div>
    </label>

    <div class="meta">
      <div class="meta-item"><span class="meta-label">文件名</span><span class="meta-value" id="fileName">尚未选择</span></div>
      <div class="meta-item"><span class="meta-label">文件大小</span><span class="meta-value" id="fileSize">—</span></div>
    </div>

    <div class="actions"><button class="button primary" id="startButton" type="button" disabled>开始转录</button></div>
    <p class="status" aria-live="polite">状态：<strong id="statusText">等待上传</strong></p>
    <p class="hint" id="hintText">关闭转写页面会自动暂停；重新打开后可继续。</p>
    <progress id="jobProgress" max="100" value="0" style="width:100%;margin-top:12px" aria-label="录音识别进度"></progress>
    <p id="progressText" class="hint"></p>
    <section aria-label="转写任务" style="margin-top:24px">
      <h2>转写任务</h2>
      <p class="hint">暂停会保留已完成片段并释放显存；当前未完成片段会在继续时重做。删除可从数据目录的回收区恢复。</p>
      <div id="jobList"></div>
    </section>

    <section class="result hidden" id="resultPanel" aria-labelledby="resultTitle">
      <div class="result-head"><h2 id="resultTitle">文稿</h2></div>
      <article class="transcript" id="transcript" aria-live="polite"></article>
      <div class="result-actions">
        <button class="button" id="copyButton" type="button" disabled>复制全文</button>
        <button class="button" id="downloadButton" type="button" disabled>下载 TXT</button>
        <a class="button primary hidden" id="continueStudio">在 Text Studio 继续</a>
      </div>
    </section>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const allowed=new Set(['.wav','.mp3','.m4a','.mp4']);
const labels={queued:'排队中',decoding:'解码录音',loading:'加载模型',recognizing:'正在识别',cleaning:'整理文稿',pausing:'正在暂停',paused:'已暂停',deleting:'正在删除',completed:'已完成',failed:'失败'};
const active=new Set(['queued','decoding','loading','recognizing','cleaning','pausing','deleting']);
let selectedFile=null,jobId='',finalText='',resultFilename='',studioUrl='',allJobs=[],refreshBusy=false,listSignature='';
function extension(name){return name.slice(name.lastIndexOf('.')).toLowerCase()}
function formatSize(n){return (n/1024/1024).toFixed(1)+' MB'}
function setHint(message,error=false){$('hintText').textContent=message;$('hintText').classList.toggle('error',error)}
async function readResponse(response){const data=await response.json();if(!response.ok)throw new Error(data.error||response.status);return data}
function getJob(id){return fetch('/api/transcript/jobs/'+id,{cache:'no-store'}).then(readResponse)}
function progressLabel(job){
 const p=job.progress||{};
 if(!p.total_seconds)return labels[job.stage]||job.stage;
 const percent=Math.min(100,Math.floor(100*p.processed_seconds/p.total_seconds));
 return percent+'% · '+Number(p.processed_seconds).toFixed(0)+' / '+Number(p.total_seconds).toFixed(0)+' 秒 · '+p.completed_chunks+'/'+p.total_chunks+' 段';
}
function display(job){
 jobId=job.job_id;resultFilename=job.filename;
 $('fileName').textContent=job.filename;$('fileSize').textContent=formatSize(job.size||0);
 $('statusText').textContent=labels[job.stage]||job.stage;
 $('progressText').textContent=progressLabel(job);
 const p=job.progress||{};
 if(job.stage==='completed')$('jobProgress').value=100;
 else if(p.total_seconds)$('jobProgress').value=100*p.processed_seconds/p.total_seconds;
 else if(active.has(job.stage))$('jobProgress').removeAttribute('value');
 else $('jobProgress').value=0;
 if(job.error)setHint(job.error,true);
 else setHint(job.stage==='paused'?'已暂停，点击继续可从已完成片段恢复。':'关闭页面会暂停任务；文稿和已完成片段会保留。');
 finalText=job.stage==='completed'?(job.text||''):'';
 $('transcript').textContent=finalText;$('resultPanel').classList.toggle('hidden',!finalText);
 $('copyButton').disabled=!finalText;$('downloadButton').disabled=!finalText;
 const url=new URL(studioUrl||location.href,location.href);
 if(!studioUrl){url.port='8770';url.pathname='/';url.search='';url.hash=''}
 url.searchParams.set('transcript_id',jobId);$('continueStudio').href=url.href;
 $('continueStudio').classList.toggle('hidden',!finalText);
}
async function action(id,verb){
 if(verb==='delete'&&!confirm('停止并将这个转写任务、上传副本和文稿移入回收区？原始录音不受影响。'))return;
 try{
  const data=await fetch('/api/transcript/jobs/'+id+'/'+verb,{method:'POST'}).then(readResponse);
  if(verb!=='delete'){selectedFile=null;display(data)}
  if(data.stage==='deleted'&&id===jobId){jobId='';finalText='';$('resultPanel').classList.add('hidden');$('statusText').textContent='已删除';$('jobProgress').value=0;$('progressText').textContent=''}
  await refresh();
 }catch(e){setHint(e.message,true)}
}
function renderJobs(){
 const signature=JSON.stringify(allJobs.map(j=>[j.job_id,j.filename,j.stage,j.progress]));
 if(signature===listSignature)return;listSignature=signature;
 const box=$('jobList');box.replaceChildren();
 if(!allJobs.length){box.textContent='暂无任务';return}
 for(const job of allJobs){
  const row=document.createElement('div');row.style.cssText='border-top:1px solid #e4e7ec;padding:12px 0';
  const text=document.createElement('div');text.textContent=job.filename+' — '+(labels[job.stage]||job.stage)+' · '+progressLabel(job);row.append(text);
  const buttons=document.createElement('div');buttons.className='actions';buttons.style.marginTop='8px';
  function button(title,fn,disabled=false){const b=document.createElement('button');b.type='button';b.className='button';b.textContent=title;b.disabled=disabled;b.onclick=fn;buttons.append(b)}
  button('查看',async()=>{try{display(await getJob(job.job_id))}catch(e){setHint(e.message,true)}});
  if(active.has(job.stage))button('暂停',()=>action(job.job_id,'pause'),['pausing','deleting'].includes(job.stage));
  if(['paused','failed'].includes(job.stage))button('继续',()=>action(job.job_id,'resume'));
  button('删除',()=>action(job.job_id,'delete'),job.stage==='deleting');
  row.append(buttons);box.append(row);
 }
}
async function refresh(){
 if(refreshBusy)return;refreshBusy=true;
 try{
  const data=await fetch('/api/transcript/jobs',{cache:'no-store'}).then(readResponse);allJobs=data.jobs||[];
  renderJobs();
  const select=$('savedResults');const previous=select.value;select.replaceChildren(new Option('选择历史文稿',''));
  for(const j of allJobs.filter(j=>j.stage==='completed'))select.add(new Option(j.filename,j.job_id));
  select.value=previous;
  if(!jobId&&!selectedFile&&allJobs.length)jobId=allJobs[0].job_id;
  if(jobId&&allJobs.some(j=>j.job_id===jobId)){const requestedId=jobId;const current=await getJob(requestedId);if(jobId===requestedId&&!selectedFile)display(current)}
  await Promise.all(allJobs.filter(j=>active.has(j.stage)).map(j=>fetch('/api/transcript/jobs/'+j.job_id+'/heartbeat',{method:'POST'})));
 }catch(e){setHint('读取任务失败：'+e.message,true)}
 finally{refreshBusy=false}
}
function setFile(file){
 if(!file)return;if(!allowed.has(extension(file.name))){setHint('请选择 wav、mp3、m4a 或 mp4',true);return}
 selectedFile=file;jobId='';finalText='';$('fileName').textContent=file.name;$('fileSize').textContent=formatSize(file.size);
 $('startButton').disabled=false;$('resultPanel').classList.add('hidden');$('statusText').textContent='等待开始';
 $('jobProgress').value=0;$('progressText').textContent='';setHint('点击开始转录');
}
async function start(){
 if(!selectedFile)return;$('startButton').disabled=true;
 const file=selectedFile;
 try{
  const data=await new Promise((resolve,reject)=>{
   const xhr=new XMLHttpRequest();xhr.open('POST','/api/transcript/jobs');xhr.setRequestHeader('X-Filename',encodeURIComponent(file.name));xhr.setRequestHeader('Content-Type','application/octet-stream');
   xhr.upload.onprogress=e=>{if(e.lengthComputable){$('jobProgress').value=100*e.loaded/e.total;setHint('上传录音 '+Math.floor(100*e.loaded/e.total)+'%')}};
   xhr.onerror=()=>reject(new Error('上传连接失败'));
   xhr.onload=()=>{try{const d=JSON.parse(xhr.responseText);xhr.status<300?resolve(d):reject(new Error(d.error||'上传失败'))}catch(e){reject(e)}};
   xhr.send(file);
  });
  selectedFile=null;$('fileInput').value='';display(data);await refresh();
 }catch(e){setHint(e.message,true);$('startButton').disabled=false}
}
$('openResult').onclick=async()=>{try{const id=$('savedResults').value;if(id)display(await getJob(id))}catch(e){setHint(e.message,true)}};
$('copyButton').onclick=async()=>{if(finalText){await navigator.clipboard.writeText(finalText);setHint('已复制全文')}};
$('downloadButton').onclick=()=>{if(!finalText)return;const link=document.createElement('a');link.href=URL.createObjectURL(new Blob(['\ufeff',finalText],{type:'text/plain;charset=utf-8'}));link.download=(resultFilename.replace(/\.[^.]+$/,'')||'文稿')+'.txt';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)};
$('fileInput').onchange=e=>setFile(e.target.files?.[0]);$('startButton').onclick=start;
for(const name of ['dragenter','dragover'])$('dropzone').addEventListener(name,e=>{e.preventDefault();$('dropzone').classList.add('dragover')});
for(const name of ['dragleave','drop'])$('dropzone').addEventListener(name,e=>{e.preventDefault();$('dropzone').classList.remove('dragover')});
$('dropzone').addEventListener('drop',e=>setFile(e.dataTransfer.files?.[0]));
window.addEventListener('pagehide',()=>{for(const j of allJobs)if(active.has(j.stage))navigator.sendBeacon('/api/transcript/jobs/'+j.job_id+'/pause','')});
(async()=>{try{const h=await fetch('/api/health').then(readResponse);studioUrl=h.text_studio_url||''}catch(e){setHint(e.message,true)}await refresh();setInterval(refresh,1500)})();
</script>
</body>
</html>
