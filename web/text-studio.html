<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>语音智播 · 文本泛化工作台</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--blue2:#1d4ed8;--shadow:0 12px 34px rgba(15,23,42,.08);--radius:18px}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f8fafc,#f3f6fb);color:var(--text)}.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 80px}.top{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;margin-bottom:22px}.title h1{margin:0;font-size:28px;letter-spacing:-.02em}.title p{margin:8px 0 0;color:var(--muted);font-size:14px}.status{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.badge{padding:7px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;border:1px solid #e0e7ff}.badge.ok{background:#ecfdf5;color:#047857;border-color:#d1fae5}.badge.bad{background:#fef2f2;color:#b91c1c;border-color:#fee2e2}.grid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px}.card{background:rgba(255,255,255,.94);border:1px solid rgba(229,231,235,.95);border-radius:var(--radius);box-shadow:var(--shadow)}.side{padding:18px;position:sticky;top:18px;align-self:start}.section-title{font-size:14px;font-weight:700;margin:0 0 12px}.drop{border:1.5px dashed #cbd5e1;border-radius:14px;padding:18px;text-align:center;background:#f8fafc;cursor:pointer}.drop:hover{border-color:#94a3b8}.drop strong{display:block;font-size:14px;margin-bottom:5px}.drop span{font-size:12px;color:var(--muted)}input[type=file]{display:none}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;font:inherit;color:var(--text);outline:none}textarea:focus,input:focus,select:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}textarea.source{height:260px;resize:vertical;margin-top:12px;font-size:13px;line-height:1.65}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-top:14px}.field label{display:block;font-size:12px;color:#475569;font-weight:600;margin-bottom:7px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:650;cursor:pointer;background:#eef2f7;color:#111827}.btn:hover{filter:brightness(.98)}.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.hint{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.55}.msg{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f8fafc;font-size:12px;color:#475569;display:none}.msg.err{display:block;background:#fef2f2;color:#b91c1c}.msg.ok{display:block;background:#ecfdf5;color:#047857}.msg.info{display:block;background:#eff6ff;color:#1d4ed8}.main{padding:18px}.empty{padding:80px 20px;text-align:center;color:var(--muted)}.summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.summary .metric{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px}.results{display:flex;flex-direction:column;gap:14px}.para{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff}.para-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.para-id{font-size:12px;font-weight:700;color:#475569}.para-meta{font-size:11px;color:#94a3b8}.original{font-size:13px;line-height:1.75;color:#475569;background:#f8fafc;border-radius:12px;padding:11px 12px;margin-bottom:10px;white-space:pre-wrap}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-size:12px;cursor:pointer}.tab.active{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}.candidate{min-height:105px;resize:vertical;line-height:1.65;font-size:13px}.para-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:9px}.small{padding:7px 10px;border-radius:10px;font-size:12px}.footer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.grid{grid-template-columns:1fr}.side{position:static}.top{flex-direction:column}.status{justify-content:flex-start}.wrap{padding:18px 14px 60px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="title"><h1>语音智播 · 文本泛化工作台</h1><p>上传原稿，按自然段泛化，人工确认后再交给语音智播。</p></div><div class="status" id="status"><span class="badge">正在检查服务…</span></div></div>
  <div class="grid">
    <aside class="card side">
      <h2 class="section-title">1. 原稿</h2>
      <label class="drop" for="fileInput"><strong>上传 TXT 文本</strong><span>或直接粘贴到下方输入框</span></label>
      <input id="fileInput" type="file" accept=".txt,text/plain" />
      <textarea id="sourceText" class="source" placeholder="粘贴直播原稿。空行会被识别为自然段边界。"></textarea>
      <div class="actions"><button class="btn ghost" id="parseBtn">解析自然段</button><button class="btn" id="clearBtn">清空</button></div>
      <div class="field"><label>2. 泛化引擎</label><select id="provider"><option value="codex">本地 Codex</option><option value="chatgpt">ChatGPT（需配置本地命令）</option></select></div>
      <div class="row"><div class="field"><label>每段候选数</label><select id="candidateCount"><option>3</option><option>4</option><option>5</option></select></div><div class="field"><label>默认声音</label><input id="voice" value="default" /></div></div>
      <div class="field"><label>额外要求（可选）</label><textarea id="instruction" rows="4" placeholder="例如：保持节奏快；不要新增营销承诺。"></textarea></div>
      <div class="actions"><button class="btn primary" id="generalizeBtn" disabled>泛化全部段落</button></div>
      <div class="hint">原稿始终保留；泛化结果不会自动覆盖原文。默认按 8 个自然段一批调用本地模型。</div><div id="message" class="msg"></div>
    </aside>
    <main class="card main"><div class="summary" id="summary"><span class="metric">尚未解析文本</span></div><div id="results" class="results"><div class="empty">上传或粘贴文本后，先点击“解析自然段”。</div></div><div class="footer-actions" id="footerActions" style="display:none"><button class="btn ghost" id="exportTxt">导出选中版本 TXT</button><button class="btn ghost" id="exportJson">导出智播稿 JSON</button></div></main>
  </div>
</div>
<script>
const state={paragraphs:[],providerStatus:{},ttsReady:false,sourceName:'manual.txt'};const $=id=>document.getElementById(id);function showMessage(text,type='info'){const el=$('message');el.className='msg '+type;el.textContent=text}function clearMessage(){$('message').className='msg';$('message').textContent=''}async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json().catch(()=>({error:'invalid_response'}));if(!r.ok)throw new Error(data.error||('HTTP '+r.status));return data}async function health(){try{const r=await fetch('/api/health',{cache:'no-store'});const h=await r.json();state.providerStatus=h.providers||{};state.ttsReady=!!h.tts?.ready;const b=[];b.push(`<span class="badge ${h.providers?.codex?'ok':'bad'}">Codex ${h.providers?.codex?'可用':'不可用'}</span>`);b.push(`<span class="badge ${h.providers?.chatgpt?'ok':''}">ChatGPT ${h.providers?.chatgpt?'可用':'未配置'}</span>`);b.push(`<span class="badge ${state.ttsReady?'ok':'bad'}">TTS ${state.ttsReady?'就绪':'未就绪'}</span>`);$('status').innerHTML=b.join('')}catch(e){$('status').innerHTML='<span class="badge bad">服务异常</span>'}}function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){const list=state.paragraphs;$('generalizeBtn').disabled=!list.length;$('footerActions').style.display=list.length?'flex':'none';if(!list.length){$('summary').innerHTML='<span class="metric">尚未解析文本</span>';$('results').innerHTML='<div class="empty">上传或粘贴文本后，先点击“解析自然段”。</div>';return}const generated=list.filter(p=>p.candidates?.length).length;const chars=list.reduce((n,p)=>n+p.original_text.length,0);$('summary').innerHTML=`<span class="metric">自然段 ${list.length}</span><span class="metric">原稿 ${chars} 字</span><span class="metric">已泛化 ${generated}/${list.length}</span>`;$('results').innerHTML=list.map((p,i)=>{const candidates=p.candidates||[];const selected=p.selectedIndex||0;const editor=p.editedText??candidates[selected]??'';return `<section class="para" data-index="${i}"><div class="para-head"><div><span class="para-id">${p.id}</span> <span class="para-meta">${p.sentences?.length||0} 句 · ${p.original_text.length} 字</span></div><button class="btn ghost small" onclick="regenerate(${i})">重生成本段</button></div><div class="original">${escapeHtml(p.original_text)}</div>${candidates.length?`<div class="tabs">${candidates.map((c,ci)=>`<button class="tab ${ci===selected?'active':''}" onclick="selectCandidate(${i},${ci})">候选 ${ci+1}</button>`).join('')}</div><textarea class="candidate" oninput="editCandidate(${i},this.value)">${escapeHtml(editor)}</textarea><div class="para-actions"><button class="btn ghost small" onclick="preview(${i})">本机试听</button></div>`:'<div class="hint">等待泛化。</div>'}</section>`}).join('')}async function parseText(){clearMessage();const text=$('sourceText').value;if(!text.trim()){showMessage('请先上传或粘贴文本。','err');return}try{const data=await api('/api/parse',{text});state.paragraphs=data.paragraphs.map(p=>({...p,candidates:[],selectedIndex:0,editedText:''}));render();showMessage(`已解析 ${data.paragraph_count} 个自然段。`,'ok')}catch(e){showMessage(e.message,'err')}}async function generalizeSubset(indexes){const provider=$('provider').value;if(!state.providerStatus[provider])throw new Error(provider==='chatgpt'?'ChatGPT 本地命令尚未配置。':'Codex 命令不可用。');const paragraphs=indexes.map(i=>({id:state.paragraphs[i].id,original_text:state.paragraphs[i].original_text}));const data=await api('/api/generalize',{provider,candidate_count:Number($('candidateCount').value),instruction:$('instruction').value,paragraphs});const byId=Object.fromEntries(data.paragraphs.map(p=>[p.id,p]));indexes.forEach(i=>{const p=state.paragraphs[i];p.candidates=byId[p.id]?.candidates||[];p.selectedIndex=0;p.editedText=p.candidates[0]||''});return data}async function generalizeAll(){clearMessage();const btn=$('generalizeBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>泛化中';try{const indexes=state.paragraphs.map((_,i)=>i);const data=await generalizeSubset(indexes);render();showMessage(`泛化完成，共 ${state.paragraphs.length} 段，用时 ${data.elapsed_seconds}s。`,'ok')}catch(e){showMessage(e.message,'err')}finally{btn.disabled=false;btn.textContent='泛化全部段落'}}window.regenerate=async i=>{clearMessage();try{await generalizeSubset([i]);render();showMessage(`${state.paragraphs[i].id} 已重新生成。`,'ok')}catch(e){showMessage(e.message,'err')}};window.selectCandidate=(i,ci)=>{const p=state.paragraphs[i];p.selectedIndex=ci;p.editedText=p.candidates[ci]||'';render()};window.editCandidate=(i,value)=>{state.paragraphs[i].editedText=value};window.preview=async i=>{const p=state.paragraphs[i];const text=(p.editedText||p.candidates?.[p.selectedIndex||0]||'').trim();if(!text){showMessage('本段还没有可试听文本。','err');return}try{showMessage('已提交本机 TTS，正在合成并播放…','info');await api('/api/tts/preview',{text,voice:$('voice').value||'default'});showMessage('本段试听完成。','ok')}catch(e){showMessage('TTS 试听失败：'+e.message,'err')}};function download(name,content,type){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function selectedText(p){return(p.editedText||p.candidates?.[p.selectedIndex||0]||p.original_text).trim()}$('exportTxt').onclick=()=>download('智播稿-选中版本.txt',state.paragraphs.map(selectedText).join('\n\n'),'text/plain;charset=utf-8');$('exportJson').onclick=()=>{const out={schema_version:1,source_name:state.sourceName,provider:$('provider').value,candidate_count:Number($('candidateCount').value),instruction:$('instruction').value,paragraphs:state.paragraphs.map(p=>({id:p.id,original_text:p.original_text,candidates:p.candidates||[],selected_index:p.selectedIndex||0,selected_text:selectedText(p)}))};download('智播稿.json',JSON.stringify(out,null,2),'application/json;charset=utf-8')};$('fileInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;state.sourceName=f.name;$('sourceText').value=await f.text();showMessage(`已载入 ${f.name}，点击“解析自然段”。`,'info')});$('parseBtn').onclick=parseText;$('generalizeBtn').onclick=generalizeAll;$('clearBtn').onclick=()=>{$('sourceText').value='';state.paragraphs=[];render();clearMessage()};health();render();
</script>
</body>
</html>
